<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Marking Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .product-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .product-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .product-item.selected {
            background: #f0f4ff;
            border-color: #667eea;
        }

        .product-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .product-meta {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .quantity-input {
            width: 70px;
            padding: 6px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            text-align: center;
        }

        .order-type {
            width: 100px;
            padding: 6px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .alert {
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
        }

        .selected-summary {
            background: #f9f9f9;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }

        h3 {
            margin-bottom: 12px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>    🎯 Sale Marking Automation By Dinesh</h1>
            <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
                <label for="envSelect" style="font-size: 13px; color: #555;">Environment:</label>
                <select id="envSelect" onchange="switchEnvironment(this.value)" style="padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
                    <option value="QA">QA</option>
                    <option value="UAT">UAT</option>
                </select>
                <span id="envNote" style="font-size: 12px; color: #999;"></span>
            </div>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <!-- Step 1: Search Customer -->
            <div id="customerSearch" class="form-section">
                <h2>Step 1: Search Customer</h2>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="phoneInput" placeholder="Enter customer phone number" maxlength="10">
                </div>
                <button class="btn-primary" onclick="searchCustomer()">Search Customer</button>

                <div id="customerResults" style="margin-top: 20px; display: none;">
                    <div class="product-list" id="customerList"></div>
                </div>
            </div>

            <!-- Step 2: Select Products -->
            <div id="productSelection" class="form-section" style="display: none;">
                <h2>Step 2: Select Products</h2>
                
                <div class="selected-summary" id="customerSummary" style="display: none;">
                    <div class="summary-item">
                        <strong>Customer:</strong>
                        <span id="summaryCustomerName"></span>
                    </div>
                    <div class="summary-item">
                        <strong>City ID:</strong>
                        <span id="summaryCityId"></span>
                    </div>
                </div>

                <h3>Available Products</h3>
                <div class="product-list" id="productList"></div>

                <div id="manualProductBlock" style="display: none; margin-top: 16px; padding: 12px; border: 2px dashed #667eea; border-radius: 6px; background: #f8f9ff;">
                    <h3>No catalog products found — enter Product ID manually</h3>
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        <label style="font-size: 13px;">Product ID:</label>
                        <input type="number" id="manualProductId" min="1" placeholder="e.g. 183" style="width: 90px; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
                        <label style="font-size: 13px;">Qty:</label>
                        <input type="number" id="manualQty" min="1" value="1" style="width: 55px; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
                        <label style="font-size: 13px;">Type:</label>
                        <select id="manualType" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">
                            <option>one_time</option>
                            <option>daily</option>
                            <option>weekend</option>
                            <option>alternate</option>
                        </select>
                        <button class="btn-primary" onclick="addManualProduct()">Add Product</button>
                    </div>
                    <div id="manualSelected" style="margin-top: 10px; font-size: 13px;"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;">
                    <button class="btn-primary" onclick="backToSearch()" style="background: #e0e0e0; color: #333;">Back</button>
                    <button class="btn-primary" onclick="proceedToOrder()">Proceed</button>
                </div>
            </div>

            <!-- Step 3 & 4: Order Summary -->
            <div id="orderCompletion" class="form-section" style="display: none;">
                <h2>Step 3 & 4: Confirm & Mark Sale</h2>

                <div class="selected-summary">
                    <h3>Order Summary</h3>
                    <div id="orderSummary"></div>
                </div>

                <div class="form-group">
                    <label>Sale Marking Date (Step-8)</label>
                    <input type="date" id="saleDateInput" onchange="updateSaleDateLabel()">
                </div>

                <button class="btn-primary" onclick="completeOrder()">Place Order & Mark Sale</button>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <div class="spinner"></div>
            <p id="loadingText">Processing...</p>
        </div>
    </div>

    <script>
        let selectedCustomer = null;
        let selectedProducts = [];

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 5000);
        }

        async function loadCurrentEnvironment() {
            try {
                const response = await fetch('/api/environment');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('envSelect').value = data.env.toUpperCase();
                    updateEnvNote(data.env.toUpperCase());
                }
            } catch (error) {
                console.error('Failed to load environment:', error);
            }
        }

        async function switchEnvironment(env) {
            showLoading(`Switching to ${env} ...`);
            try {
                const response = await fetch('/api/environment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ env: env })
                });
                const data = await response.json();
                hideLoading();
                updateEnvNote(env);
                showAlert(data.message || `Environment switched to ${env}`, data.success ? 'success' : 'error');
            } catch (error) {
                hideLoading();
                showAlert(`Failed to switch environment: ${error.message}`, 'error');
            }
        }

        function updateEnvNote(env) {
            const note = document.getElementById('envNote');
            note.textContent = env === 'UAT'
                ? 'APIs: uat-cms | DB: beejapuri_UAT'
                : 'APIs: qa-cms | DB: beejapuri_QA';
        }

        window.addEventListener('DOMContentLoaded', loadCurrentEnvironment);

        function showLoading(text = 'Processing...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingModal').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingModal').style.display = 'none';
        }

        async function searchCustomer() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                showAlert('Please enter a phone number', 'error');
                return;
            }
            showLoading('Searching customer...');
            try {
                const response = await fetch(`/api/customer/search?phone=${phone}`);
                const data = await response.json();
                hideLoading();
                if (data.success && data.data.length > 0) {
                    displayCustomers(data.data);
                } else {
                    showAlert('No customers found', 'warning');
                }
            } catch (error) {
                hideLoading();
                showAlert(`Error: ${error.message}`, 'error');
            }
        }

        function displayCustomers(customers) {
            const customerList = document.getElementById('customerList');
            customerList.innerHTML = customers.map(c => {
                const fullName = (c.FIRST_NAME || '') + (c.LAST_NAME ? ' ' + c.LAST_NAME : '');
                const area = c.AREA || (c.attributes && c.attributes.length > 0 ? c.attributes[0].AREA : 'N/A');
                const franchise = c.FRANCHISE || (c.attributes && c.attributes.length > 0 ? c.attributes[0].FRANCHISE : 'Not Set');
                const city = c.CITY || (c.attributes && c.attributes.length > 0 ? c.attributes[0].CITY : 'N/A');
                
                return `
                    <div class="product-item" style="cursor: pointer;" onclick="selectCustomer({
                        id: ${c.ID}, 
                        customerId: '${c.CUSTOMER_ID || ''}',
                        name: '${fullName}', 
                        phone: '${c.PRIMARY_CONTACT_NUMBER || ''}',
                        email: '${c.EMAIL || ''}',
                        area: '${area}',
                        franchise: '${franchise}',
                        city: '${city}',
                        attributes: ${JSON.stringify(c.attributes || [])}
                    })">
                        <div style="flex: 1;">
                            <div class="product-name">${fullName || 'Unknown'}</div>
                            <div class="product-meta">📱 Phone: ${c.PRIMARY_CONTACT_NUMBER}</div>
                            <div class="product-meta">📍 Area: ${area} | 🏢 Franchise: ${franchise}</div>
                            <div class="product-meta">🏙️ City: ${city}</div>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('customerResults').style.display = 'block';
        }

        function selectCustomer(customer) {
            selectedCustomer = customer;
            document.getElementById('summaryCustomerName').textContent = customer.name;
            document.getElementById('summaryCityId').textContent = customer.city;
            document.getElementById('customerSummary').style.display = 'block';
            document.getElementById('customerSearch').style.display = 'none';
            document.getElementById('productSelection').style.display = 'block';
            fetchProducts();
        }

        async function fetchProducts() {
            showLoading('Fetching products...');
            try {
                const cityId = selectedCustomer.city && selectedCustomer.city !== 'N/A' ? selectedCustomer.city : '';
                const response = await fetch(`/api/product/fetch?customerId=${selectedCustomer.customerId}&cityId=${cityId}`);
                const data = await response.json();
                hideLoading();
                if (data.success) {
                    if (data.data && data.data.length > 0) {
                        displayProducts(data.data);
                    } else {
                        document.getElementById('productList').innerHTML = '';
                        document.getElementById('manualProductBlock').style.display = 'block';
                        showAlert('No catalog products for this customer — enter Product ID manually', 'warning');
                    }
                } else {
                    showAlert('No products available', 'warning');
                }
            } catch (error) {
                hideLoading();
                showAlert(`Error: ${error.message}`, 'error');
            }
        }

        function addManualProduct() {
            const pidInput = document.getElementById('manualProductId').value;
            const pid = parseInt(pidInput);
            if (!pid || isNaN(pid)) {
                showAlert('Enter a valid Product ID', 'error');
                return;
            }
            const qty = parseInt(document.getElementById('manualQty').value) || 1;
            const type = document.getElementById('manualType').value;
            if (selectedProducts.some(p => p.id === pid)) {
                showAlert('Product ' + pid + ' already added', 'warning');
                return;
            }
            selectedProducts.push({ id: pid, name: 'Product ' + pid, quantity: qty, order_type: type });
            renderManualSelected();
            document.getElementById('manualProductId').value = '';
            showAlert('Product ' + pid + ' added (qty ' + qty + ', ' + type + ')', 'success');
        }

        function removeManualProduct(pid) {
            selectedProducts = selectedProducts.filter(p => p.id !== pid);
            renderManualSelected();
        }

        function renderManualSelected() {
            const container = document.getElementById('manualSelected');
            container.innerHTML = selectedProducts.map(p => `
                <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee;">
                    <span>${p.name} × ${p.quantity} (${p.order_type})</span>
                    <span style="cursor: pointer; color: #721c24;" onclick="removeManualProduct(${p.id})">✕ Remove</span>
                </div>`).join('') || '<span style="color:#999;">No products added yet.</span>';
        }

        function displayProducts(products) {
            const productList = document.getElementById('productList');
            productList.innerHTML = products.map(p => `
                <div class="product-item" id="prod-${p.id}">
                    <input type="checkbox" class="product-checkbox" onchange="toggleProduct(this, ${p.id}, '${p.name}')">
                    <div style="flex: 1;">
                        <div class="product-name">${p.name}</div>
                        <div class="product-meta">${p.description || ''}</div>
                    </div>
                    <input type="number" min="1" value="1" class="quantity-input" id="qty-${p.id}">
                    <select class="order-type" id="type-${p.id}">
                        <option>daily</option>
                        <option>weekend</option>
                        <option>alternate</option>
                    </select>
                </div>
            `).join('');
        }

        function toggleProduct(checkbox, productId, productName) {
            const qty = parseInt(document.getElementById(`qty-${productId}`).value);
            const type = document.getElementById(`type-${productId}`).value;

            if (checkbox.checked) {
                selectedProducts.push({ id: productId, name: productName, quantity: qty, order_type: type });
                document.getElementById(`prod-${productId}`).classList.add('selected');
            } else {
                selectedProducts = selectedProducts.filter(p => p.id !== productId);
                document.getElementById(`prod-${productId}`).classList.remove('selected');
            }
        }

        function proceedToOrder() {
            if (selectedProducts.length === 0) {
                showAlert('Please select at least one product', 'error');
                return;
            }
            const summary = document.getElementById('orderSummary');
            summary.innerHTML = selectedProducts.map(p => `
                <div class="summary-item">
                    <span>${p.name}</span>
                    <span>Qty: ${p.quantity} | ${p.order_type}</span>
                </div>
            `).join('');
            document.getElementById('productSelection').style.display = 'none';
            document.getElementById('orderCompletion').style.display = 'block';
            setDefaultSaleDate();
        }

        async function completeOrder() {
            showLoading('Processing order...');
            try {
                const saleDateEl = document.getElementById('saleDateInput');
                let saleDate = saleDateEl && saleDateEl.value ? saleDateEl.value : new Date().toISOString().split('T')[0];
                // Convert yyyy-MM-dd to dd-MM-yyyy
                saleDate = convertDateToDisplay(saleDate);

                const response = await fetch('/api/order/place-and-mark', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerId: selectedCustomer.customerId,
                        customerName: selectedCustomer.name,
                        cityId: selectedCustomer.city,
                        latitude: null,
                        longitude: null,
                        saleDate: saleDate,
                        products: selectedProducts
                    })
                });
                const result = await response.json();
                hideLoading();
                if (result.success) {
                    showAlert('✅ Sale marked successfully!', 'success');
                    resetForm();
                } else {
                    showAlert(`Error: ${result.message}`, 'error');
                }
            } catch (error) {
                hideLoading();
                showAlert(`Error: ${error.message}`, 'error');
            }
        }

        function updateSaleDateLabel() {
            const el = document.getElementById('saleDateInput');
            if (el && el.value) {
                showAlert(`Sale will be registered on ${convertDateToDisplay(el.value)}`, 'info');
            }
        }

        function convertDateToDisplay(dateStr) {
            if (!dateStr) return dateStr;
            const parts = dateStr.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                // yyyy-MM-dd -> dd-MM-yyyy
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }

        function setDefaultSaleDate() {
            const el = document.getElementById('saleDateInput');
            if (el) {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                el.value = `${yyyy}-${mm}-${dd}`;
            }
        }

        function backToSearch() {
            document.getElementById('productSelection').style.display = 'none';
            document.getElementById('customerSearch').style.display = 'block';
            document.getElementById('manualProductBlock').style.display = 'none';
            document.getElementById('manualSelected').innerHTML = '';
            selectedProducts = [];
        }

        function resetForm() {
            document.getElementById('phoneInput').value = '';
            document.getElementById('customerResults').style.display = 'none';
            document.getElementById('orderCompletion').style.display = 'none';
            document.getElementById('manualProductBlock').style.display = 'none';
            document.getElementById('manualSelected').innerHTML = '';
            document.getElementById('customerSearch').style.display = 'block';
            selectedCustomer = null;
            selectedProducts = [];
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('phoneInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchCustomer();
            });
        });
    </script>
</body>
</html>
